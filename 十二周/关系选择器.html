<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*子带选择器*/
       div>a {
        color:aquamarine;
       }
        /*相邻兄弟*/
        p+span {
            text-decoration: double;line-through;   
        }
        /*普通兄弟*/
        p~span {
            color:azure;
        }
    </style>
</head>
<body>
    <div>
        <a href="#"></a>
        <p>
            <a href="#"></a>
        </p>
        <span>靠近 p 的第一个</span>
        <span>靠近 p 的第二个</span>
        <span>靠近 p 的第三个</span>
    </div>
</body>
</html>
