<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        li:first-child{background-color: aqua;}
        li:last-child{background-color: red;}
        li:nth-child(2){background-color: red;}
       ** li:nth-child(2+1){background-color: red;}
    </style>
</head>
<body>
    <ul>
        <li>大娃：力大无穷</li>
        <li>二娃：千里眼顺风耳</li>
        <li>三娃：金刚不坏</li>
        <li>四娃：水</li>
        <li>五娃：火</li>
        <li>六娃：隐身</li>
        <li>七娃：宝葫芦</li>
    </ul>
</body>
</html>
