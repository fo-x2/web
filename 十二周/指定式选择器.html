<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color: blue;
        }
        .font {
            color: red;
        }
        p.font {
            color: green;
        }
    </style>
</head>
<body>
    <p>指定式选择器</p>
    <p class="font">这是红色的段落</p>
    <h3 class="font">这是绿色的标题</h3>
</body>
</html>
